<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Baby Calm-Down</title>
<style>
:root{--bg:#fef6e4;--ink:#1f2937;--panel:#fff;--bus:#facc15;--bus2:#eab308;--seat:#2563eb;--seat2:#1d4ed8;--floor:#fff7d6;--sky1:#7dd3fc;--sky2:#e0f2fe;--road:#374151;--accent:#ef4444;--muted:#6b7280;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--ink:#f1f5f9;--panel:#1e293b;--bus:#ca8a04;--bus2:#a16207;--seat:#3b82f6;--seat2:#2563eb;--floor:#1f2937;--sky1:#1e3a8a;--sky2:#312e81;--road:#111827;--muted:#94a3b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--ink:#f1f5f9;--panel:#1e293b;--bus:#ca8a04;--bus2:#a16207;--seat:#3b82f6;--seat2:#2563eb;--floor:#1f2937;--sky1:#1e3a8a;--sky2:#312e81;--road:#111827;--muted:#94a3b8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100%;box-sizing:border-box;justify-content:center}
header{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:0 2px 8px #0002}
header b{font-size:20px}
.bus{position:relative;background:var(--bus);border:4px solid var(--bus2);border-radius:22px;padding:10px;animation:bob .5s ease-in-out infinite alternate;overflow:hidden}
@keyframes bob{to{transform:translateY(2px)}}
.win{position:relative;height:64px;border-radius:12px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));margin-bottom:10px}
.scene{position:absolute;left:0;bottom:16px;display:flex;width:max-content;font-size:34px;letter-spacing:18px;white-space:nowrap;animation:scroll 5s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.road{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--road)}
.road::after{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px);animation:dash .4s linear infinite}
@keyframes dash{to{background-position:-44px 0}}
.seats{display:grid;grid-template-columns:1fr 1fr .45fr 1fr 1fr;gap:8px;background:var(--floor);border-radius:12px;padding:10px}
.seat{position:relative;aspect-ratio:1.1;border:0;border-radius:14px 14px 8px 8px;background:linear-gradient(var(--seat),var(--seat2));font-size:clamp(28px,9vw,42px);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seat:active{filter:brightness(1.2)}
.seat.cry{animation:shake .22s linear infinite;box-shadow:0 0 0 4px var(--accent),0 0 18px var(--accent)}
.seat.cry::after{content:"💧";position:absolute;top:-4px;right:2px;font-size:18px;animation:drip .5s linear infinite}
.seat.bad{box-shadow:0 0 0 4px var(--accent)}
@keyframes shake{0%{transform:translate(-2px,0) rotate(-3deg)}50%{transform:translate(2px,-1px) rotate(3deg)}100%{transform:translate(-2px,0) rotate(-3deg)}}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(14px);opacity:0}}
.bar{position:absolute;left:8%;right:8%;bottom:5px;height:5px;border-radius:3px;background:#fff;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.shot{position:absolute;font-size:28px;margin:-14px 0 0 -14px;transition:transform .2s ease-out;pointer-events:none;z-index:5}
.pop{position:absolute;top:-6px;left:50%;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;animation:rise .6s ease-out forwards;z-index:6}
@keyframes rise{to{transform:translateY(-30px);opacity:0}}
.hint{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;padding:20px;z-index:20}
.overlay.hide{display:none}
.card{background:var(--panel);border-radius:20px;padding:24px;max-width:340px;text-align:center;box-shadow:0 8px 30px #0006}
