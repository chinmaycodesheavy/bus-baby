<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Baby Calm-Down</title>
<style>
:root{--bg:#fef6e4;--ink:#1f2937;--panel:#fff;--bus:#facc15;--bus2:#eab308;--seat:#2563eb;--seat2:#1d4ed8;--floor:#fff7d6;--sky1:#7dd3fc;--sky2:#e0f2fe;--road:#374151;--accent:#ef4444;--muted:#6b7280;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--ink:#f1f5f9;--panel:#1e293b;--bus:#ca8a04;--bus2:#a16207;--seat:#3b82f6;--seat2:#2563eb;--floor:#1f2937;--sky1:#1e3a8a;--sky2:#312e81;--road:#111827;--muted:#94a3b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--ink:#f1f5f9;--panel:#1e293b;--bus:#ca8a04;--bus2:#a16207;--seat:#3b82f6;--seat2:#2563eb;--floor:#1f2937;--sky1:#1e3a8a;--sky2:#312e81;--road:#111827;--muted:#94a3b8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100%;box-sizing:border-box;justify-content:center}
header{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:0 2px 8px #0002}
header b{font-size:20px}
.bus{position:relative;background:var(--bus);border:4px solid var(--bus2);border-radius:22px;padding:10px;animation:bob .5s ease-in-out infinite alternate;overflow:hidden}
@keyframes bob{to{transform:translateY(2px)}}
.win{position:relative;height:64px;border-radius:12px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));margin-bottom:10px}
.scene{position:absolute;left:0;bottom:16px;display:flex;width:max-content;font-size:34px;letter-spacing:18px;white-space:nowrap;animation:scroll 5s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.road{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--road)}
.road::after{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px);animation:dash .4s linear infinite}
@keyframes dash{to{background-position:-44px 0}}
.seats{display:grid;grid-template-columns:1fr 1fr .45fr 1fr 1fr;gap:8px;background:var(--floor);border-radius:12px;padding:10px}
.seat{position:relative;aspect-ratio:1.1;border:0;border-radius:14px 14px 8px 8px;background:linear-gradient(var(--seat),var(--seat2));font-size:clamp(28px,9vw,42px);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seat:active{filter:brightness(1.2)}
.seat.cry{animation:shake .22s linear infinite;box-shadow:0 0 0 4px var(--accent),0 0 18px var(--accent)}
.seat.cry::after{content:"💧";position:absolute;top:-4px;right:2px;font-size:18px;animation:drip .5s linear infinite}
.seat.bad{box-shadow:0 0 0 4px var(--accent)}
@keyframes shake{0%{transform:translate(-2px,0) rotate(-3deg)}50%{transform:translate(2px,-1px) rotate(3deg)}100%{transform:translate(-2px,0) rotate(-3deg)}}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(14px);opacity:0}}
.bar{position:absolute;left:8%;right:8%;bottom:5px;height:5px;border-radius:3px;background:#fff;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.shot{position:absolute;font-size:28px;margin:-14px 0 0 -14px;transition:transform .2s ease-out;pointer-events:none;z-index:5}
.pop{position:absolute;top:-6px;left:50%;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;animation:rise .6s ease-out forwards;z-index:6}
@keyframes rise{to{transform:translateY(-30px);opacity:0}}
.hint{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;padding:20px;z-index:20}
.overlay.hide{display:none}
.card{background:var(--panel);border-radius:20px;padding:24px;max-width:340px;text-align:center;box-shadow:0 8px 30px #0006}
.card h1{margin:0 0 8px;font-size:24px}
.card p{margin:0 0 16px;color:var(--muted);line-height:1.4}
.card button{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:12px;padding:12px 28px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>Score <b id="score">0</b></div>
    <div id="lives" aria-label="Lives"></div>
    <div>Best <b id="best">0</b></div>
  </header>
  <div class="bus" id="bus">
    <div class="win"><div class="scene" id="scene"></div><div class="road"></div></div>
    <div class="seats" id="seats"></div>
  </div>
  <p class="hint">Tap a crying baby to send a bottle and calm it down. Wrong seat costs a point!</p>
</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ovTitle">🚌 Bus Baby Calm-Down</h1>
    <p id="ovText">Babies keep crying on random seats. Tap each one to fire a bottle before it wails. Miss 3 and the passengers revolt!</p>
    <button id="go">Start</button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const PAX=['🧑','👩','👨','🧓','👵','🧔','👩‍🦰','🧑‍🦱','👴'];
const rnd=a=>a[Math.random()*a.length|0];
let seats=[],score=0,lives=3,running=false,timers=new Set(),best=0;
try{best=+localStorage.getItem('bbBest')||0}catch(e){}
$('#best').textContent=best;
const strip='🌳🏠🌲🌳🏢🌳🌲🏠🌳🏬🌲🌳';
$('#scene').textContent=strip+strip;

function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id}
function clearAll(){timers.forEach(clearTimeout);timers.clear()}

const seatsEl=$('#seats');
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
  if(c===2){seatsEl.appendChild(document.createElement('div'));continue}
  const el=document.createElement('button');
  el.className='seat';el.setAttribute('aria-label','Seat');
  const s={el,baby:false,t:null,p:rnd(PAX)};
  el.textContent=s.p;
  el.addEventListener('pointerdown',e=>{e.preventDefault();tap(s)});
  seatsEl.appendChild(el);seats.push(s);
}

function setLives(){$('#lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function setScore(){$('#score').textContent=score}
function reset(s,face){
  s.baby=false;s.el.classList.remove('cry');
  const b=s.el.querySelector('.bar');if(b)b.remove();
  s.el.firstChild.textContent=face||s.p;
}
function pop(s,txt){
  const e=document.createElement('span');e.className='pop';e.textContent=txt;
  s.el.appendChild(e);setTimeout(()=>e.remove(),600);
}
function fly(s){
  const b=$('#bus'),br=b.getBoundingClientRect(),r=s.el.getBoundingClientRect();
  const e=document.createElement('span');e.className='shot';e.textContent='🍼';
  e.style.left=br.width/2+'px';e.style.top=br.height+'px';b.appendChild(e);
  const dx=r.left+r.width/2-br.left-br.width/2,dy=r.top+r.height/2-br.top-br.height;
  requestAnimationFrame(()=>{e.style.transform=`translate(${dx}px,${dy}px) rotate(540deg)`});
  setTimeout(()=>e.remove(),230);
}
function tap(s){
  if(!running)return;
  fly(s);
  if(s.baby){
    clearTimeout(s.t);timers.delete(s.t);
    reset(s,'😊');pop(s,'+1');
    score++;setScore();
    later(()=>{if(!s.baby)reset(s)},500);
  }else{
    if(score>0){score--;setScore()}
    pop(s,'-1');s.el.classList.add('bad');
    setTimeout(()=>s.el.classList.remove('bad'),250);
  }
}
function show(s){
  const stay=Math.max(500,1300-score*30);
  s.baby=true;s.el.firstChild.textContent='👶';s.el.classList.add('cry');
  const bar=document.createElement('i');bar.className='bar';bar.style.animationDuration=stay+'ms';
  s.el.appendChild(bar);
  try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
  s.t=later(()=>miss(s),stay);
}
function miss(s){
  reset(s,'😡');lives--;setLives();
  later(()=>{if(!s.baby)reset(s)},500);
  if(lives<=0)end();
}
function spawn(){
  if(!running)return;
  const max=Math.min(4,1+Math.floor(score/8));
  const free=seats.filter(s=>!s.baby);
  if(seats.length-free.length<max)show(rnd(free));
  const gap=Math.max(280,800-score*15);
  later(spawn,gap*(.6+Math.random()*.8));
}
function start(){
  clearAll();score=0;lives=3;running=true;
  seats.forEach(s=>{s.p=rnd(PAX);reset(s)});
  setScore();setLives();
  $('#ov').classList.add('hide');
  later(spawn,600);
}
function end(){
  running=false;clearAll();
  seats.forEach(s=>reset(s));
  const nb=score>best;
  if(nb){best=score;$('#best').textContent=best;try{localStorage.setItem('bbBest',best)}catch(e){}}
  $('#ovTitle').textContent='😤 Passengers revolted!';
  $('#ovText').textContent='You calmed '+score+' babies.'+(nb&&score>0?' New best score!':' Best: '+best+'.');
  $('#go').textContent='Play again';
  $('#ov').classList.remove('hide');
}
$('#go').addEventListener('click',start);
setLives();
</script>
</body>
</html>
